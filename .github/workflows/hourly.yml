name: GGPoker hourly leaderboard

on:
  schedule:
  - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect leaderboard
        run: python ggpoker_leaderboard.py

      - name: Generate leaderboard analysis
        run: python leaderboard_analysis.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard_snapshots.csv leaderboard_changes.csv raw_responses/
          git diff --cached --quiet || git commit -m "Update GGPoker leaderboard"
          git push
